<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page of Playing Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <main id="playing-cards">

      <div class="card">
        <div class="left black">
          <span>A</span>
          <span>♠</span>
        </div>
        <div class="middle black">♠</div>
        <div class="right black">
          <span>♠</span>
          <span>A</span>
        </div>
      </div>

      <div class="card">
        <div class="left red">
          <span>K</span>
          <span>♥</span>
        </div>
        <div class="middle red">♥</div>
        <div class="right red">
          <span>♥</span>
          <span>K</span>
        </div>
      </div>

      <div class="card">
        <div class="left red">
          <span>Q</span>
          <span>♦</span>
        </div>
        <div class="middle red">♦</div>
        <div class="right red">
          <span>♦</span>
          <span>Q</span>
        </div>
      </div>

    </main>

  </body>
</html>
