<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

</body>
<h1> My To-Do List </h1>
<ul class="todo-list">
  <li>
    <input type="checkbox" id="todo-1">
    <label for="todo-1">Buy Groceries</label>
    <ul class="sub-item">
      <li>
        <a class="sub-item-link" href="https://example.com/grocery-list" target="_blank">View Grocery Details</a>
      </li>
    </ul>
  </li>

  <li>
    <input type="checkbox" id="todo-2">
    <label for="todo-2">Clean Room</label>
    <ul class="sub-item">
      <li>
        <a class="sub-item-link" href="https://example.com/cleaning-tips" target="_blank">Cleaning Checklist</a>
      </li>
    </ul>
  </li>

  <li>
    <input type="checkbox" id="todo-3">
    <label for="todo-3">Study Coding</label>
    <ul class="sub-item">
      <li>
        <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">Open freeCodeCamp</a>
      </li>
    </ul>
  </li>

  <li>
    <input type="checkbox" id="todo-4">
    <label for="todo-4">Exercise</label>
    <ul class="sub-item">
      <li>
        <a class="sub-item-link" href="https://example.com/workout" target="_blank">Workout Routine</a>
      </li>
    </ul>
  </li>
</ul>
</html>
