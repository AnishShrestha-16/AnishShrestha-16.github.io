<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Job Application Form</h1>
    
    <form>
      <label for="name">Full Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="position">Position:</label>
      <select id="position" required>
        <option value="" disabled selected>Select a position</option>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="manager">Manager</option>
      </select>

      <fieldset class="radio-group">
        <legend>Availability:</legend>
        <div class="radio-options">
          <div class="radio-item">
            <input type="radio" id="full-time" name="availability" value="full-time" required>
            <label for="full-time">Full-Time</label>
          </div>
          <div class="radio-item">
            <input type="radio" id="part-time" name="availability" value="part-time" required>
            <label for="part-time">Part-Time</label>
          </div>
        </div>
      </fieldset>

      <label for="message">Why do you want this job?</label>
      <textarea id="message" placeholder="Write your motivation" required></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>

</body>
</html>
