<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
<h1 id="title"> freeCodeCamp Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve the platform</p>
 
 <form id="survey-form" #survey form>
 
  <label id="name-label" for="name">Name:</label>
<input id="name" type="text" placeholder="Enter your name" required>
 
 <label id="email-label" for="email">Email:</label>
 <input id="email" type="email" placeholder="Enter your email" required>

 <label id="number-label" for="number">Age(optional)</label>
 <input id="number" type="number" placeholder="Enter your age" min="10" max="100"></input>

<p> Which option best describes your current role? </p>
<label id="dropdown-label" for="dropdown"></label>
  <select id="dropdown">
    <option value="">Select current role</option>
    <option value="student">Student</option>
    <option value="job">Full Time Job</option>
  </select>

  <p>Would you recommend freeCodeCamp to a friend?</p>
  <label>
    <input type="radio" name="recommend" value="definitely" checked> Definitely
  </label>
  <label>
    <input type="radio" name="recommend" value="maybe"> Maybe
  </label>

  <p>What would you like to see improved? (Check all that apply)</p>
  <label>
    <input type="checkbox" value="front-end"> Front-end Projects
  </label>
  <label>
    <input type="checkbox" value="back-end"> Back-end Projects
  </label>

  <p>Any comments or suggestions?</p>
  <textarea id="comments" name="comments" placeholder="Enter your comment here..."></textarea>

  <button id="submit" type="submit">Submit</button>

</form>

  </body>
</html>
