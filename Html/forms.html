<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
<form action="index.php"method="post" enctype="multipart/form-data">
    <label for="username">username:</label>
    <input type="text" id="name" minlength="8" maxlength="100" required><br><br>
    <label for="password">password:</label>
    <input type="password" id="password" minlength="8" maxlength="18" required><br><br> 
    <input for="email">email:</label>
    <input type="email" id="email" placeholder="example@gmail.com"><br><br>
    <label for="phone">phone #:</label>
    <input type="tel" id="phone" placeholder="123-456-7890" patter="[0-9][2]-[0-9][4][0-9][4]"><br><br>
    
    <label for="birthday">birthday:</label>
    <input type="date" id="birthday"><br><br>
    <label for="quantity">quantity:</label>
    <input type="number" id="quantity" min="0" max="100" value="1"><br><br>
    
    <label for="title">title:</label>
    <label for="Mr">Mr.:</label>
    <input type="radio" id="Mr" name="title" value="Mr">
    <label for="Ms">Ms.:</label>
    <input type="radio" id="Ms" name="title" value="Ms">
    <label for="Rather not say">Rather not say:</label>
    <input type="radio" id="Rather not say" name="title" value="Rather not say">     
    </select> <br><br>  
    
    <label for="payment">Payment Method:</label>
    <select id="payment" name="payment">
        <option value="credit">Credit Card</option>
        <option value="debit">Debit Card</option>
        <option value="paypal">PayPal</option>
        </select> <br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comments here..."></textarea><br><br>
        <label for="file">Upload a file:</label>
          <input type="file" id="file" name="file" accept="image/jpeg"><br><br>
          <input type="reset" value="Reset"> <br>
    <input type="submit" value="Submit"> 
</form>    
</body>
